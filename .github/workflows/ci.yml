name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build JungleGame.sln -c Release

      - name: Test with coverage
        # The perf canaries are wall-clock node floors; code-coverage
        # instrumentation slows the search loop ~25x, so they must not run
        # inside the instrumented invocation (see the un-instrumented step).
        run: dotnet test JungleGame.Tests -c Release --filter "Category!=Perf" --collect:"XPlat Code Coverage"

      - name: Performance gates (un-instrumented)
        run: dotnet test JungleGame.Tests -c Release --filter "Category=Perf"

      - name: Check coverage gate
        run: powershell -File scripts/check-coverage.ps1

      - name: Engine smoke test
        # Crash detector only — small budgets keep this step to a few minutes
        # (--smoke turns an inconclusive gate into exit 0)
        run: dotnet run --project JungleGame.Bench -c Release -- --arena --games 2 --timeA 1000 --timeB 300 --smoke

      - name: Tactical suite
        # 11 fixed-depth tactical positions; catches search/eval regressions fast
        run: dotnet run --project JungleGame.Bench -c Release -- --testsuite

      - name: Node-count regression gate
        # Fixed-depth node counts vs Bench/bench-baseline.json (deterministic
        # searches — machine-independent); fails on > 15% growth at equal depth
        run: dotnet run --project JungleGame.Bench -c Release -- --bench --positions bench-positions.tsuite
